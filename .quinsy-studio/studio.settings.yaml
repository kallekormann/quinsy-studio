# Studio HQ — train / infusion / STUDIO_LO only.
# Product execute uses projects/<name>/docs/studio.settings.yaml.
# How to size S–XL: GETTING_STARTED.md § Studio settings (cost / tokens).
# Override: studio-templates/studio.settings.local.example.yaml
# → .quinsy-studio/studio.settings.local.yaml (gitignored; no API keys).
#
# Estimates are chars/4 of CARD + listed files, not host billing.
# Committed table is size M (session 400k).

runtime: cursor

cost:
  profile: standard
  model_hint: ""
  estimate: chars_div_4
  warn_at_pct: 80
  session_token_budget: 400000
  max_files_open_on_implement: 12
  never_dump_backlog: true
  load_full_ticket_only_on: IMPLEMENT
  max_qa_retries: 3
  train_parallel: true
  train_open_max: 12
  production_ready_min: 2
  human_review_every_sprints: 2
  steps:
    intake:
      context: 24000
      budget: 200000
    architecture:
      context: 32000
      budget: 250000
    design:
      context: 40000
      budget: 400000
    planning:
      context: 16000
      budget: 80000
    scoping:
      context: 12000
      budget: 60000
    implement:
      context: 28000
      budget: 400000
    review:
      context: 16000
      budget: 80000
    reuse:
      context: 12000
      budget: 40000
    learning:
      context: 16000
      budget: 120000
    retro:
      context: 12000
      budget: 40000
