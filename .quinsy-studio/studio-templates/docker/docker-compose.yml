version: '3.8'

# =============================================================================
# Quinsy Studio — Base Docker Template
# =============================================================================
# Copied into the project folder as the base during project setup
# (./studio env <project> init) and extended there per project.
#
# Placeholders replaced during init:
#   {{PROJECT_NAME}}  → project name
#
# Project-specific extensions (services, builds, volumes) belong ONLY
# in projects/<name>/docker/ — NEVER in this template.
# =============================================================================

# Compose project name → containers prefixed {{PROJECT_NAME}}-* (not docker-*)
name: {{PROJECT_NAME}}

services:
  db:
    container_name: {{PROJECT_NAME}}-postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: {{PROJECT_NAME}}-redis
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: App-Service (für Full-Stack-Projekte einblenden)
  # app:
  #   build: .
  #   ports:
  #     - "${APP_HOST_PORT:-13000}:3000"
  #   environment:
  #     DATABASE_URL: postgresql://postgres:postgres@db:5432/${PROJECT_NAME}
  #     REDIS_URL: redis://redis:6379
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  postgres_data:
